[project]
name = "zyra"
version = "0.1.0"
description = "Dynamic heterogeneous multi-agent system for long-horizon complex tasks."
requires-python = ">=3.12"
dependencies = [
    "browser-use[core]==0.13.3",
    "psutil>=7,<8",
]

[project.scripts]
zyra-source-custody = "zyra_integrations.source_custody.cli:main"
zyra-freeze-audit = "zyra_evaluation.freeze_audit.cli:main"
zyra-regression-hardening = "zyra_evaluation.regression_hardening.cli:main"
zyra-deploy = "zyra_orchestration.deployment.cli:main"
zyra-release = "zyra_productization.release.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = [
    "apps/api",
    "packages/code_index",
    "packages/commands",
    "packages/core",
    "packages/evaluation",
    "packages/integrations",
    "packages/memory",
    "packages/orchestration",
    "packages/productization",
    "packages/runtime",
    "packages/scheduler",
    "packages/skills",
    "packages/symbolic",
    "packages/workers",
    "packages/workspace",
]
include = ["zyra_*"]
namespaces = false

[tool.setuptools.package-data]
zyra_integrations = ["data/*.json"]
zyra_evaluation = ["data/*.json"]

[tool.zyra]
phase = "m3-symbolic-collaboration"
