<!doctype html>
<html lang="en" data-api-base-url="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Zyra Console Transport</title>
    <style>
      :root {
        background: #090b10;
        color: #e7eaf0;
        font: 15px/1.5 Inter, ui-sans-serif, system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px; }
      main { width: min(900px, 100%); border: 1px solid #2a303c; border-radius: 16px; background: #11151d; padding: 28px; }
      header { display: flex; gap: 16px; align-items: center; justify-content: space-between; }
      h1 { margin: 0; font-size: 1.2rem; letter-spacing: 0.02em; }
      p { color: #9ca6b8; }
      button { border: 1px solid #4a5569; border-radius: 8px; color: inherit; background: #1b2330; padding: 8px 12px; cursor: pointer; }
      button:disabled { cursor: wait; opacity: 0.55; }
      #transport-status { display: inline-flex; margin-top: 12px; border-radius: 999px; padding: 6px 10px; background: #252b36; }
      #transport-status[data-state="ready"] { color: #8ce6b1; background: #123324; }
      #transport-status[data-state="blocked"] { color: #ff9d9d; background: #3a1c22; }
      pre { max-height: 60vh; overflow: auto; border-radius: 10px; background: #090c12; padding: 18px; color: #b8c4d8; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Zyra typed transport boundary</h1>
        <button id="transport-refresh" type="button">Refresh</button>
      </header>
      <p>
        This temporary M2-S01A-01 entry verifies the single typed client against the real API.
        M2-S01A-02 replaces it with the React application shell.
      </p>
      <output id="transport-status" data-state="checking">Checking typed transport…</output>
      <pre id="transport-payload" aria-live="polite"></pre>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
